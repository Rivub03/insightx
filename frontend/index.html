<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightX — Data Source Onboarding</title>
  </head>
  <body>
    <!--
      This is the single HTML page that Vite serves.
      React mounts itself into the <div id="root"> below.
      Everything you see in the browser is rendered by React — this file
      is just the shell.
    -->
    <div id="root"></div>

    <!--
      Vite reads this script tag and processes src/main.jsx as the entry point.
      type="module" is required — it tells the browser this is ES module JavaScript.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
